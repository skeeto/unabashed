# On a vX.Y.Z tag, publish a GitHub release of that tag with its source
# tarball, unabashed-X.Y.Z.tar.gz, attached. The tarball is the committed
# tree (git archive), so it includes the man page, unabashed.1. The tag
# must match the VERSION macro in src/unabashed.cpp, and the release notes
# are the annotated tag's message.

name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build source tarball
        run: |
          version=${GITHUB_REF_NAME#v}
          macro=$(sed -n 's/^#define VERSION "\(.*\)"$/\1/p' src/unabashed.cpp)
          if [ "$version" != "$macro" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match VERSION \"$macro\""
              exit 1
          fi
          name=unabashed-$version
          git archive --prefix="$name/" -o "$name.tar.gz" "$GITHUB_SHA"
          tar -tzf "$name.tar.gz" "$name/unabashed.1" >/dev/null
          echo "TARBALL=$name.tar.gz" >>"$GITHUB_ENV"

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ env.TARBALL }}
          path: ${{ env.TARBALL }}
          compression-level: 0

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # checkout leaves the tag lightweight; fetch the annotated tag
          # so its message (sans subject and signature) is the notes.
          git fetch --force origin "+$GITHUB_REF:$GITHUB_REF"
          git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME" >notes.md
          gh release create "$GITHUB_REF_NAME" "$TARBALL" \
              --verify-tag --notes-file notes.md \
              --title "unabashed ${GITHUB_REF_NAME#v}"
